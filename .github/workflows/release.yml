name: Build and Release Packaged App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
        include:
          - os: windows-latest
            artifact_name: koshu-workbench-windows
            launcher: start.bat
          - os: macos-latest
            artifact_name: koshu-workbench-macos
            launcher: start.command

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Build frontend
        run: |
          cd frontend
          npm install
          npm install -D vite-plugin-singlefile
          npx vite build
          cd ..

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pyinstaller

      - name: Run PyInstaller Build
        run: |
          python -m PyInstaller --clean --noconfirm koshu-ocr.spec

      - name: Copy launcher script (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          copy start.bat dist\koshu-ocr-backend\

      - name: Copy launcher script (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          cp start.command dist/koshu-ocr-backend/
          chmod +x dist/koshu-ocr-backend/start.command
          chmod +x dist/koshu-ocr-backend/koshu-ocr-backend

      - name: Compress Build Directory (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          powershell Compress-Archive -Path dist/koshu-ocr-backend/* -DestinationPath ${{ matrix.artifact_name }}.zip

      - name: Compress Build Directory (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          cd dist
          zip -r ../${{ matrix.artifact_name }}.zip koshu-ocr-backend
          cd ..

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}.zip

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            koshu-workbench-windows/koshu-workbench-windows.zip
            koshu-workbench-macos/koshu-workbench-macos.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
